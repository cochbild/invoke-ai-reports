[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoke-ai-reports"
version = "0.1.0"
description = "Analytics dashboard for InvokeAI image generation data"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1,<0.137.0",
    "uvicorn[standard]>=0.46.0,<0.47.0",
    "sqlalchemy>=2.0.40,<2.1.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.9.0,<3.0.0",
    # Transitive pin: CVE-2025-62727 (DoS via multipart parsing) — fixed in 0.49.1
    "starlette>=0.49.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[project.scripts]
invoke-ai-reports = "backend.app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.uv]
package = true
