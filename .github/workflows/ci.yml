name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run pytest
        run: uv run pytest -v

      - name: pip-audit (vulnerability scan)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --no-dev -q -o /tmp/reqs.txt
          uv run --extra dev pip-audit -r /tmp/reqs.txt

  frontend:
    name: Frontend (vitest, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Run vitest
        run: npx vitest run

      - name: npm audit (vulnerability scan)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
